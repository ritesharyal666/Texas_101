<!DOCTYPE html>
<html lang="en">
<head>

    {% block title %}
    <title>BlogCMS</title>
    {% endblock %}
</head>
<body>
    <header>
        <nav>
                <a href="{% url 'home' %}">Home</a>
                <a href="{% url 'post_list' %}">Posts</a>

    </footer>

</html>
