{% extends 'blog/base.html' %}

{% block title %}
<title>Posts | BlogCMS</title>
{% endblock %}

{% block content %}
<h1>All Posts</h1>

{% for post in posts %}
<article>
    <h2><a href="{% url 'post_detail' post.slug %}">{{ post.title }}</a></h2>
    <p>{{ post.content|truncatewords:30 }}</p>
</article>
{% empty %}
<p>No posts have been published yet.</p>
{% endfor %}
{% endblock %}
