{% extends 'blog/base.html' %}
{% block content %}
{% for post in posts %}
    <h2><a href="{% url 'post_detail' post.slug %}">{{ post.title }}</a></h2>
    <p>{{ post.content|truncatewords:20 }}</p>
    <p>{{ post.author.username }} : {{ post.created_at|date:"F j, Y" }}</p>
{% endfor %}
{% endblock %}
