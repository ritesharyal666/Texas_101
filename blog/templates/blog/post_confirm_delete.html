{% extends 'blog/base.html' %}
{% block content %}
    <h2>Delete "{{ post.title }}"?</h2>
    <p>This cannot be undone.</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
        <a href="{% url 'post_detail' post.slug %}">Cancel</a>
    </form>
{% endblock %}
